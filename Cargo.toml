[workspace]
resolver = "2"
members = [
  "crates/herd-protocol",
  "crates/herd-core",
  "crates/herd-daemon",
  "apps/cli",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Urdemonlord/universal-herd"
authors = ["Meow Labs"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
directories = "6"
hickory-proto = "=0.26.3"
hickory-resolver = "=0.26.3"
hickory-server = "=0.26.3"
http-body-util = "=0.1.5"
hyper = { version = "=1.13.0", features = ["http1", "server", "client"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[package]
name = "universal-herd-desktop"
# This crate is excluded from the root workspace (see root Cargo.toml),
# so it cannot inherit workspace.package values. Keep these in sync
# with the root workspace by hand: version 0.1.0, edition 2024, MIT.
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "universal_herd_desktop"
path = "src/lib.rs"

[[bin]]
name = "universal-herd-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
herd-daemon = { path = "../../../crates/herd-daemon" }
herd-protocol = { path = "../../../crates/herd-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Install frontend dependencies
        working-directory: apps/desktop/ui
        run: npm ci
      - name: Build herd CLI
        run: cargo build --release --bin herd
      - name: Stage herd as Tauri sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries
          Copy-Item target/release/herd.exe apps/desktop/src-tauri/binaries/herd-x86_64-pc-windows-msvc.exe
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: npx --yes @tauri-apps/cli@2
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: herd-windows-msi
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: herd-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
      - name: Upload herd CLI
        uses: actions/upload-artifact@v4
        with:
          name: herd-windows-cli
          path: target/release/herd.exe
